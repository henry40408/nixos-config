name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are pointless once a newer commit is pushed;
# main is exempt so every merged commit keeps a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # lint, test and build are intentionally independent: formatting/eval
  # failures and build failures are separate signals, so gating the builds behind
  # lint only delayed the whole run by lint's duration.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14

      - name: Check formatting
        run: |
          nix develop --command nixfmt --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Flake check
        run: nix flake check

  build:
    name: build (${{ matrix.config }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: vm
            runs-on: ubuntu-latest
            attr: nixosConfigurations.vm.config.system.build.toplevel
          # Both macOS outputs are built in one entry: GitHub bills macOS runners
          # at a 10x multiplier, and the two closures are disjoint (home-manager
          # is standalone on darwin, not a nix-darwin module), so a second runner
          # would only duplicate the fixed setup cost.
          - config: darwin
            runs-on: macos-latest
          - config: nixos@linux-x86_64
            runs-on: ubuntu-latest
            attr: homeConfigurations."nixos@linux-x86_64".activationPackage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # Skipped on darwin: the GitHub Actions cache API rate-limits it (HTTP 418),
      # so every run built the same ~500 derivations locally regardless.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: matrix.config != 'darwin'
      - name: Build ${{ matrix.config }}
        if: matrix.config != 'darwin'
        run: nix build .#${{ matrix.attr }}

      # Pull requests only evaluate the darwin outputs: compiling them takes ~9 min
      # on a 10x-billed macOS runner and mostly rebuilds nixvim and manpage
      # derivations that no cache serves. Evaluation still catches option, type and
      # attribute errors; main runs the full build.
      - name: Build darwinConfigurations.darwin
        if: matrix.config == 'darwin'
        run: nix build ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} .#darwinConfigurations.darwin.system
      - name: Build henry@darwin
        if: matrix.config == 'darwin'
        run: nix build ${{ github.event_name == 'pull_request' && '--dry-run' || '' }} .#homeConfigurations."henry@darwin".activationPackage
      # Building the system only writes the Brewfile; `brew bundle` runs during
      # activation, which CI never performs. Cask and formula names are plain
      # strings until then, so a typo or an upstream rename would survive every
      # other check here and only surface on a `darwin-rebuild switch`.
      - name: Validate declared Homebrew names
        if: matrix.config == 'darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          declared() {
            nix eval --json ".#darwinConfigurations.darwin.config.homebrew.$1" | jq -r '.[].name'
          }
          brews=$(declared brews)
          casks=$(declared casks)
          # Piped through xargs rather than relying on word splitting, so each
          # name becomes its own argument regardless of IFS. One `brew info` per
          # kind resolves the whole list and fails if any name is unknown.
          [ -z "$brews" ] || echo "$brews" | xargs brew info --formula > /dev/null
          [ -z "$casks" ] || echo "$casks" | xargs brew info --cask > /dev/null

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
